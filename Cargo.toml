[workspace]
resolver = "3"
members = ["crates/core", "crates/hls", "crates/py", "crates/remux", "crates/sysproxy"]

[workspace.package]
# 发布的版本（SemVer）；Python 包的版本由 maturin 按 PEP 440 换写，如 1.0.0-dev.0 即 1.0.0.dev0
version = "1.0.0-dev.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/x-haose/hs-m3u8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
aes = "0.9.3"
axum = "0.8.9"
cbc = "0.2.1"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["format", "static"] }
http = "1.5.0"
httpdate = "1.0.3"
libc = "0.2.190"
# abi3-py312：开启 abi3 时，3.12 起才能用 Rust 定义继承 Exception 的类（异常要带有类型的字段）；
# experimental-async：#[pymethods] 里的 async fn 返回 Python 协程
pyo3 = { version = "0.29.3", features = ["abi3-py312", "experimental-async", "multiple-pymethods"] }
# 默认特性带 numpy 等类型的存根支持，用不上；infer_signature 生成参数默认值的写法
pyo3-stub-gen = { version = "0.23.1", default-features = false, features = ["infer_signature"] }
reqwest = { version = "0.13.5", features = ["cookies", "socks"] }
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
system-configuration = "0.7.0"
thiserror = "2.0.21"
tokio = "1.53.2"
tokio-rustls = "0.26.6"
tokio-util = "0.7.20"
url = "2.5.8"
windows-registry = "0.6.1"

[patch.crates-io]
# 去掉 macOS 已移除的 QTKit，见 third_party/ffmpeg-sys-next/PATCHED.md
ffmpeg-sys-next = { path = "third_party/ffmpeg-sys-next" }
