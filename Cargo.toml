[workspace]
resolver = "3"
members = ["crates/core", "crates/hls", "crates/remux"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/x-haose/hs-m3u8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
aes = "0.9.3"
axum = "0.8.9"
cbc = "0.2.1"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["format", "static"] }
libc = "0.2.190"
reqwest = { version = "0.13.5", features = ["cookies", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = "1.53.2"
tokio-util = "0.7.19"
url = "2.5.8"

[patch.crates-io]
# 去掉 macOS 已移除的 QTKit，见 third_party/ffmpeg-sys-next/PATCHED.md
ffmpeg-sys-next = { path = "third_party/ffmpeg-sys-next" }
