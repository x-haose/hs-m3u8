[project]
name = "hs-m3u8"
version = "1.0.0.dev0"
description = "HLS（m3u8）下载：并发拉取、AES-128 解密与校验、断点续传、直播录制，输出 MP4 或可直接播放的本地 HLS"
authors = [{ name = "昊色居士", email = "xhrtxh@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]

[project.urls]
homepage = "https://github.com/x-haose/hs-m3u8"
repository = "https://github.com/x-haose/hs-m3u8"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[dependency-groups]
# 开发工具固定版本：类型检查与格式的结果随版本变化
dev = [
    "basedpyright==1.40.2",
    "maturin==1.15.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.uv]
# 本项目的扩展模块由 maturin develop 构建安装，uv sync 只装开发工具
package = false

[tool.maturin]
manifest-path = "crates/py/Cargo.toml"
module-name = "hs_m3u8._native"
python-source = "python"

[tool.pyo3-stub-gen]
generate-init-py = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["python", "tests/python", "scripts", "examples"]
# 生成的文件不格式化、不检查（类型检查照常检查它们）
extend-exclude = ["python/hs_m3u8/__init__.py", "python/hs_m3u8/_native/__init__.pyi"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # 与 ruff format 冲突
    "COM812",
    # 文档字符串用中文，首行不按英文句号断句
    "D400",
    "D415",
    # D203/D213 与 D211/D212 互斥，取后者
    "D203",
    "D213",
    # 中文文本用全角标点
    "RUF001",
    "RUF002",
    "RUF003",
    # 许可证写在 LICENSE 与 pyproject.toml，文件头不放版权声明
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
# 测试用 assert 断言，断言里直接写期望的值；测试函数的名字即说明；反序列化的是测试自己刚序列化的数据；子进程运行的是
# 当前解释器与测试里写死的脚本
"tests/python/**" = ["S101", "PLR2004", "D103", "S301", "S603"]
# 示例用 print 显示结果；main 只是入口，做什么见文件开头的说明
"examples/**" = ["T201", "D103"]

[tool.mypy]
strict = true
files = ["python", "tests/python", "scripts", "examples"]
# 测试目录不是包，conftest 等按顶层模块导入（与 pytest 的导入方式一致）
mypy_path = ["tests/python"]
python_version = "3.12"

[tool.basedpyright]
include = ["python", "tests/python", "scripts", "examples"]
extraPaths = ["tests/python"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = ["--strict-markers", "--strict-config"]
# 警告即失败：协程没被 await、资源没关、回收时抛出的异常（PytestUnraisableExceptionWarning）都不放过；预期的警告用
# pytest.warns 断言
filterwarnings = ["error"]
xfail_strict = true
