[package]
name = "hs-m3u8-remux"
version = "0.0.0"
description = "Stream-copy HLS track files (TS / fMP4) into a single MP4 via a statically linked FFmpeg"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ffmpeg-next.workspace = true
thiserror.workspace = true

[lints.rust]
# 本 crate 是 FFmpeg 的 FFI 边界：ffmpeg-next 没有读写 AVCodecParameters 部分字段的安全接口。
# unsafe 只在 src/ffi.rs；其余 crate 继承 workspace 的 forbid。
unsafe_code = "allow"
