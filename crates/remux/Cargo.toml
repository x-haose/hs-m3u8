[package]
name = "hs-m3u8-remux"
version.workspace = true
description = "Stream-copy HLS track files (TS / fMP4 / packed audio) into a single MP4, or whole media files into MP4 / Matroska, via a statically linked FFmpeg"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
hs-m3u8-ffmpeg-sys = { path = "../ffmpeg-sys" }
hs-m3u8-subtitle = { path = "../subtitle" }
# 交给 FFmpeg 的读写错误码取 errno 的值；Windows 上 FFmpeg 读写文件出错时给的是 MSVC C 运行库的 errno，按它的取值换成
# io::ErrorKind；测试中压低进程的文件描述符上限（setrlimit）
libc.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
# 合并文件时比对输出与输入是不是同一个文件（卷序列号与文件索引）；Unix 上直接比 stat 的设备号与 inode
same-file.workspace = true

[lints.rust]
# 本 crate 直接调用 FFmpeg 的 C 接口（hs-m3u8-ffmpeg-sys），unsafe 只在 src/ffi 下的薄封装里；测试里解码校验用的
# FFmpeg 调用在 tests/remux/media.rs
unsafe_code = "allow"
