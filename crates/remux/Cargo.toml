[package]
name = "hs-m3u8-remux"
version = "0.0.0"
description = "Stream-copy HLS track files (TS / fMP4 / packed audio) into a single MP4 via a statically linked FFmpeg"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ffmpeg-next.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
# FFmpeg 读写文件出错时给的是 MSVC C 运行库的 errno，按它的取值换成 io::ErrorKind
libc.workspace = true

[dev-dependencies]
# 测试中压低进程的文件描述符上限（setrlimit）
libc.workspace = true

[lints.rust]
# 本 crate 是 FFmpeg 的 FFI 边界：ffmpeg-next 没有读写 AVCodecParameters 部分字段、读解析器状态与节目列表、查像素
# 格式描述表的安全接口。
# unsafe 只在 src/ffi.rs。
unsafe_code = "allow"
