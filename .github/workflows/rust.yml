name: rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # wheels.yml 发布之前对标签所在的提交跑一遍全部检查
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # 固定镜像版本，升级时显式修改
        os: [macos-26, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # 完整的历史与标签：对外契约要与最近的发布比较（make compat）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: MSVC 环境（Windows）
        if: runner.os == 'Windows'
        uses: ./.github/actions/msvc-env

      - name: MSYS2（Windows）
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MSYS
          path-type: inherit
          update: false
          install: make diffutils xz

      - name: FFmpeg
        uses: ./.github/actions/ffmpeg
        with:
          cache-key: ${{ runner.os }}-${{ runner.arch }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Python 开发环境（.venv，Python 3.12 即支持的最低版本）：绑定 crate 的构建脚本要用，Python 的检查与测试也用
      # uv 的版本取 pyproject.toml 的 required-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Python 开发环境
        run: uv sync --locked
        env:
          UV_PYTHON: "3.12"

      # 预生成的 FFmpeg 绑定须与 FFmpeg 的头文件、crates/ffmpeg-sys/build.rs 的清单一致，以这里生成的为准；没有提交过或
      # 不一致时失败并上传新生成的（见这个 action）。在编译之前：没有文件时后面的步骤都编不过。Linux 的两个目标在
      # wheels.yml 的 manylinux 容器里生成。macOS 用 Xcode 带的 libclang，Windows 用运行机装好的 LLVM（clang-sys 自己
      # 找到）
      - name: FFmpeg 绑定（macOS、Windows）
        if: runner.os != 'Linux'
        uses: ./.github/actions/ffmpeg-bindings

      # 检查项定义在 Makefile 的 rs_* 目标里。依赖图、许可证、覆盖率、对外契约与 Python 的检查与平台无关，只在 Linux 上查；
      # 格式、clippy、文档与测试涉及各平台专属的代码（cfg 下的、sysproxy 的 macOS 与 Windows 实现），三个平台都查
      - name: 安装 cargo-deny 与 cargo-llvm-cov（Linux）
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2,cargo-llvm-cov@0.9.1

      - name: 全部检查（Linux）
        if: runner.os == 'Linux'
        run: make rs_check py_check py_cov compat

      # abi3 的 wheel 在更新的 Python 上也要能用
      - name: 最新版 Python 上的测试（Linux）
        if: runner.os == 'Linux'
        run: make py_test VENV=.venv-latest UV_PYTHON=3.15

      - name: 格式、clippy、文档、测试（macOS）
        if: runner.os == 'macOS'
        run: make rs_fmt rs_clippy rs_doc rs_test py_test

      # Windows 的 make 只在 MSYS2 里，而 MSYS2 的 link.exe 会遮住 MSVC 的链接器，所以直接运行与 Makefile 的
      # rs_fmt、rs_clippy、rs_doc、rs_test、py_test 相同的命令。每条命令单独一步：PowerShell 里一步跑几条命令时，只有最后一条的
      # 退出码算数
      - name: 格式（Windows）
        if: runner.os == 'Windows'
        run: cargo fmt --all --check

      - name: 格式，fuzz/（Windows）
        if: runner.os == 'Windows'
        run: cargo fmt --manifest-path fuzz/Cargo.toml --check

      - name: clippy（Windows）
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          PYO3_PYTHON: ${{ github.workspace }}\.venv\Scripts\python.exe

      - name: 文档（Windows）
        if: runner.os == 'Windows'
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
          PYO3_PYTHON: ${{ github.workspace }}\.venv\Scripts\python.exe

      - name: 测试（Windows）
        if: runner.os == 'Windows'
        run: cargo test --workspace
        env:
          PYO3_PYTHON: ${{ github.workspace }}\.venv\Scripts\python.exe

      - name: Python 绑定构建（Windows）
        if: runner.os == 'Windows'
        run: uv run --no-sync maturin develop --uv

      - name: Python 测试（Windows）
        if: runner.os == 'Windows'
        run: uv run --no-sync pytest

  # 播放列表与字幕解析器的模糊测试短跑；只用纯 Rust 的 hls 与 subtitle crate，不要 FFmpeg
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # fuzz/rust-toolchain.toml 固定的 nightly
      - name: nightly 工具链
        working-directory: fuzz
        run: rustup toolchain install

      - name: 安装 cargo-fuzz 与 cargo-deny
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz@0.13.2,cargo-deny@0.20.2

      - name: 模糊测试
        run: make fuzz

      - name: 保留找到的输入
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
