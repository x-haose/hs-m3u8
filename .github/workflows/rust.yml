name: rust

on:
  push:
    branches: [rewrite/rust]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # 固定镜像版本，升级时显式修改
        os: [macos-26, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: MSVC 环境（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 找到带 VC 工具的 VS，执行 vcvarsall 后把环境变量传给后续步骤
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "找不到带 VC 工具的 Visual Studio" }
          $vars = cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" x64 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvarsall.bat 执行失败（退出码 $LASTEXITCODE）" }
          $vars | Where-Object { $_ -match '^[^=]+=' } | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: MSYS2（Windows）
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: false
          install: make diffutils xz

      - name: 缓存 FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: third_party/ffmpeg/dist
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third_party/ffmpeg/build.sh') }}

      - name: 编译 FFmpeg（Windows）
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          # MSYS2 coreutils 的 link.exe 会遮住 MSVC 的链接器
          if [ -f /usr/bin/link.exe ]; then mv /usr/bin/link.exe /usr/bin/link.exe.msys; fi
          third_party/ffmpeg/build.sh

      - name: 编译 FFmpeg（macOS / Linux）
        if: runner.os != 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: third_party/ffmpeg/build.sh

      - uses: Swatinem/rust-cache@v2

      - name: 格式
        run: cargo fmt --all --check

      # 依赖图与平台无关（各自已覆盖全部发布平台），只在 Linux 上查
      - name: 依赖方向（Linux）
        if: runner.os == 'Linux'
        run: scripts/check_deps.sh

      - name: 不许用 allow/expect 属性压制检查（Linux）
        if: runner.os == 'Linux'
        run: scripts/check_no_suppression.sh

      - name: 安装 cargo-deny（Linux）
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: 安全公告、许可证、禁用包与来源（Linux）
        if: runner.os == 'Linux'
        run: cargo deny --locked check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试
        run: cargo test --workspace

      # 数据正确性模块（hls、core、remux）的行覆盖门槛，各自不低于 80%；覆盖率与平台无关，只在 Linux 上量
      - name: 安装 cargo-llvm-cov（Linux）
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: 行覆盖（Linux）
        if: runner.os == 'Linux'
        run: |
          # 缓存恢复的旧插桩产物会混进统计，先清掉
          cargo llvm-cov clean --workspace
          cargo llvm-cov -p hs-m3u8-hls --fail-under-lines 80 --summary-only
          cargo llvm-cov -p hs-m3u8-core --fail-under-lines 80 --summary-only
          cargo llvm-cov -p hs-m3u8-remux --fail-under-lines 80 --summary-only
