name: wheels

# 构建发布用的 sdist 与各平台的 wheel：每个 wheel 装进干净的环境跑 Python 端到端测试，sdist 按 LICENSES/NOTICE.txt
# 写的步骤（先 build.sh、再 maturin）从源码构建一次。产物作为工作流的附件保留；推 v 开头的标签时另跑 rust.yml 的全部
# 检查，都通过后发布到 PyPI。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"
  # 推 tag 时 FFmpeg 不用缓存，从核对过 SHA-256 的源码包现编，发布产物里链接的不是缓存里的二进制
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv 的版本取 pyproject.toml 的 required-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Python 开发环境
        run: uv sync --locked

      # sdist 带上 FFmpeg 的源码包（LGPL 要求源码与二进制在同一处提供）
      - name: 取 FFmpeg 源码包
        run: bash third_party/ffmpeg/build.sh --fetch

      - name: 打 sdist
        run: |
          uv run --no-sync maturin sdist --out dist
          tar -tzf dist/*.tar.gz | grep -q '/third_party/ffmpeg/build/ffmpeg-[0-9.]*\.tar\.xz$'

      # 照用户的做法从 sdist 构建：PATH 最前面放一个总是失败的 curl，build.sh 若不用随附的源码包而去下载即失败
      - name: 从 sdist 构建
        run: |
          mkdir -p "$RUNNER_TEMP/sdist" "$RUNNER_TEMP/no-curl"
          printf '#!/bin/sh\necho "不应下载：$*" >&2\nexit 1\n' > "$RUNNER_TEMP/no-curl/curl"
          chmod +x "$RUNNER_TEMP/no-curl/curl"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/*/
          PATH="$RUNNER_TEMP/no-curl:$PATH" bash third_party/ffmpeg/build.sh
          "$GITHUB_WORKSPACE/.venv/bin/maturin" build --release --locked --out "$RUNNER_TEMP/from-sdist"

      # 开发环境里只有开发工具、没有从源码装的 hs_m3u8，测试用的即从 sdist 构建的 wheel
      - name: 装上从 sdist 构建的 wheel 测试
        run: |
          uv pip install "$RUNNER_TEMP"/from-sdist/*.whl
          uv run --no-sync pytest

      # PyPI 显示的元数据与 README 能否通过检查（twine 7.0.0，2026-10-15 查）
      - name: 核对元数据
        run: uvx --from twine==7.0.0 twine check --strict dist/*.tar.gz "$RUNNER_TEMP"/from-sdist/*.whl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            # 2026-10-10 的镜像，升级时显式修改
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:abd1230aa9e4058a74b89d27cd14ba18c0db036d7bfe6e6f219a29ea63c24eb6
    runs-on: ${{ matrix.runner }}
    # FFmpeg、扩展模块与测试都在 manylinux_2_28 里：链接的 glibc 符号不新于 2.28，wheel 才能标 manylinux_2_28
    container: ${{ matrix.image }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 构建依赖
        run: |
          # bindgen 要 libclang
          dnf install -y clang-devel
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: FFmpeg
        uses: ./.github/actions/ffmpeg
        with:
          cache-key: ${{ env.RELEASE != 'true' && matrix.image || '' }}

      # uv 的版本取 pyproject.toml 的 required-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Python 开发环境
        run: uv sync --locked

      - name: 构建 wheel
        run: uv run --no-sync maturin build --release --locked --compatibility manylinux_2_28 --out dist

      # 开发环境里只有开发工具、没有从源码装的 hs_m3u8，测试用的即这个 wheel
      - name: 装上 wheel 测试
        run: |
          uv pip install dist/*.whl
          uv run --no-sync pytest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-linux-${{ matrix.arch }}
          path: dist/*.whl

  # 比 rust.yml 的 macOS 旧一代：构建与测试的系统离 wheel 声称的最低版本近一些
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: FFmpeg
        uses: ./.github/actions/ffmpeg
        with:
          cache-key: ${{ env.RELEASE != 'true' && 'macos-15' || '' }}

      # uv 的版本取 pyproject.toml 的 required-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Python 开发环境
        run: uv sync --locked

      # 链接警告当错误：目标文件的最低系统版本比 wheel 声称的新时，链接器只警告
      - name: 构建 wheel
        run: uv run --no-sync maturin build --release --locked --out dist
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-fatal_warnings"

      # 开发环境里只有开发工具、没有从源码装的 hs_m3u8，测试用的即这个 wheel
      - name: 装上 wheel 测试
        run: |
          uv pip install dist/*.whl
          uv run --no-sync pytest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-macos-arm64
          path: dist/*.whl

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: MSVC 环境
        uses: ./.github/actions/msvc-env

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MSYS
          path-type: inherit
          update: false
          install: make diffutils xz

      - name: FFmpeg
        uses: ./.github/actions/ffmpeg
        with:
          cache-key: ${{ env.RELEASE != 'true' && 'windows-2025' || '' }}

      # uv 的版本取 pyproject.toml 的 required-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Python 开发环境
        run: uv sync --locked

      - name: 构建 wheel
        run: uv run --no-sync maturin build --release --locked --out dist

      # 开发环境里只有开发工具、没有从源码装的 hs_m3u8，测试用的即这个 wheel
      - name: 装上 wheel
        shell: bash
        run: uv pip install dist/*.whl

      - name: 测试
        run: uv run --no-sync pytest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-windows-x86_64
          path: dist/*.whl

  # 推标签时先核对：只发布 v<主>.<次>.<修订>（与 scripts/check_compat.py 认的发布标签一致），且提交已在 main 上
  tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 核对标签与提交
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "标签须为 v<主>.<次>.<修订>：$TAG"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG 所在的提交不在 main 上"; exit 1; }

  # 发布之前对标签所在的提交跑全部检查（含任务目录样本与对外契约，与上一次发布比较）
  checks:
    needs: tag
    uses: ./.github/workflows/rust.yml

  # 可信发布（OIDC），不用长期有效的令牌：须在 PyPI 上登记本仓库、这个工作流与 pypi 环境，否则上传时失败。版本只能
  # 发布一次，标签、提交或产物不合要求时在上传前失败
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tag, checks, sdist, linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/hs-m3u8/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # sdist 与 4 个 wheel，文件名里的版本都与标签相符
      - name: 核对产物与标签
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          shopt -s nullglob
          all=(dist/*)
          wheels=(dist/hs_m3u8-"$version"-*.whl)
          printf '%s\n' "${all[@]}"
          test "${#all[@]}" -eq 5
          test -f "dist/hs_m3u8-$version.tar.gz"
          test "${#wheels[@]}" -eq 4

      # 重跑（上次只传了一部分）时跳过已在 PyPI 上的文件，只传缺的；「重跑全部任务」会重新构建，缺的文件来自这次构建，
      # 与已上传的同出这个标签所在的提交。首次运行遇到已存在的照样失败
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: ${{ github.run_attempt > 1 }}
