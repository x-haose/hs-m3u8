name: FFmpeg 绑定
# 提交的绑定以这里生成的为准（见 scripts/ffmpeg_bindings.py）：没有提交过或不一致时失败，新生成的文件作为附件
# ffmpeg-bindings-<目标> 上传。要先有 FFmpeg（third_party/ffmpeg/dist）、Python 开发环境与 libclang；Windows 上要已加载
# MSVC 环境
description: 生成本机目标的 hs-m3u8-ffmpeg-sys 绑定并与提交的比较

runs:
  using: composite
  steps:
    # Windows 上不用 bash：Git 的 bash 把 /usr/bin 放在 PATH 前面，其中的 link.exe 遮住 MSVC 的链接器
    - name: 生成并比较
      id: unix
      if: runner.os != 'Windows'
      shell: bash
      run: uv run --no-sync python scripts/ffmpeg_bindings.py --check

    - name: 生成并比较（Windows）
      id: windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: uv run --no-sync python scripts/ffmpeg_bindings.py --check

    - name: 上传新生成的
      if: failure() && (steps.unix.outputs.upload == 'true' || steps.windows.outputs.upload == 'true')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ffmpeg-bindings-${{ steps.unix.outputs.target }}${{ steps.windows.outputs.target }}
        path: crates/ffmpeg-sys/src/bindings/${{ steps.unix.outputs.target }}${{ steps.windows.outputs.target }}.rs
        if-no-files-found: error
